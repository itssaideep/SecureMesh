# Experiment matrix configuration
# 2 × 2 Attacker × Defender configuration for thesis experiments.

matrix:
  attackers:
    - scripted          # Baseline deterministic kill-chain
    - ppo               # Autonomous adaptive RL attacker

  defenders:
    - static            # Baseline rule-based defender
    - rl                # Autonomous adaptive RL defender (PPO)

  scenarios:
    - 01_baseline
    - 02_rl_attacker
    - 03_rl_defender
    - 04_co_evolution

  seeds: [42, 123]
  episodes_per_seed: 20
  duration: 60
  output_dir: "experiments/results/matrix"

