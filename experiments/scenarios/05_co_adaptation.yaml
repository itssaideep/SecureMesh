# experiments/scenarios/05_co_adaptation.yaml
# Experiment 5: Offense-Defense Co-adaptation
# Pits Level 3 Adaptive PPO Attacker against Level 3 RL Defender.

experiment:
  id: "SCE-005"
  name: "Adversarial Co-adaptation Dynamics"
  target: "all"
  attacker: "ppo"
  defender: "rl"
  duration: 60
  episodes: 25
  seed: 42
  expected_state: "service_available"
  tags: ["co_adaptation", "rl_vs_rl", "level3_vs_level3"]
  description: >
    Studies simultaneous dynamic adaptation where both attacker and defender
    continuously update their neural policies in response to each other.
    Examines policy cycling and equilibrium behavior.

hypothesis:
  text: >
    The RL defender will maintain service availability above 0.75 even
    under continuous adaptation from the PPO attacker.
  metric: "mean_service_availability"
  threshold: 0.75
  direction: "above"
