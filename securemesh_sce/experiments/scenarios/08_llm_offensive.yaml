# experiments/scenarios/08_llm_offensive.yaml
# Experiment 8: LLM-Assisted Offensive Planning
# Pits Level 4 LLM Attacker against Level 4 Bayesian RL Defender.

experiment:
  id: "SCE-008"
  name: "LLM Offensive Strategy vs Bayesian Defender"
  target: "all"
  attacker: "llm"
  defender: "bayesian_rl"
  duration: 60
  episodes: 20
  seed: 42
  expected_state: "service_available"
  tags: ["llm_offense", "generative_agent", "level4_vs_level4"]
  description: >
    Investigates whether an offensive policy driven by Large Language Models
    (Ollama Llama 3.1:8b / Gemini 2.0 Flash) can formulate novel cyber kill-chain
    tactics that test the robustness of Bayesian posterior estimation.

hypothesis:
  text: >
    The Bayesian defender will detect and mitigate LLM-generated attack sequences
    with a detection rate of at least 65%.
  metric: "detection_rate"
  threshold: 0.65
  direction: "above"
