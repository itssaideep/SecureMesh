# experiments/scenarios/03_imitation.yaml
# Experiment 3: Imitation Learning Offensive Policy
# Pits Level 1 Behavioral Cloning Attacker against Level 1 Static Defender.

experiment:
  id: "SCE-003"
  name: "Imitation Learning Attacker Evaluation"
  target: "all"
  attacker: "bc"
  defender: "static"
  duration: 60
  episodes: 20
  seed: 42
  expected_state: "service_available"
  tags: ["imitation", "behavioral_cloning", "level1_vs_level1"]
  description: >
    Investigates whether an attacker trained via behavioral cloning on
    historical demonstration trajectories can bypass rule-based static defenses
    by mimicking human or advanced adversary behavior.

hypothesis:
  text: >
    The imitation attacker will achieve an attack success rate of at least 25%
    against static rule defenses.
  metric: "attack_success_rate"
  threshold: 0.25
  direction: "above"
