# experiments/scenarios/07_constrained_safety.yaml
# Experiment 7: Bounded Autonomy and Safety-Constrained Action Gating
# Pits Level 3 Adaptive PPO Attacker against Level 5 Constrained Defender.

experiment:
  id: "SCE-007"
  name: "Bounded Autonomy and Safety Gating"
  target: "all"
  attacker: "ppo"
  defender: "constrained"
  duration: 60
  episodes: 25
  seed: 42
  expected_state: "service_available"
  tags: ["safety_gate", "bounded_autonomy", "level3_vs_level5"]
  description: >
    Evaluates the safety filter on the Bayesian RL policy. Enforces staged
    escalation, prevents premature service shutdowns or irreversible interventions,
    and measures the reduction in safety constraint violations.

hypothesis:
  text: >
    The safety gate will preserve service availability above 0.85 and prevent
    unnecessary service isolations while maintaining effective mitigation.
  metric: "mean_service_availability"
  threshold: 0.85
  direction: "above"
