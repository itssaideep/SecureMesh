; PlatformIO Project Configuration File for ESP8266 Honeypot
;
; Build & Upload:
;   pio run --target upload
;
; Serial Monitor:
;   pio device monitor -b 115200

[platformio]
src_dir = .

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM6
monitor_port = COM6

; Board alternatives (if your board is Wemos D1 mini or generic ESP-12/01):
; board = d1_mini
; board = esp12e
; board = esp01_1m

lib_deps =
    ESP8266WiFi
    ESP8266WebServer
    ESP8266HTTPClient
