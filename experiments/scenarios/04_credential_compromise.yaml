# Scenario 04 — Credential Compromise
# The attacker uses credential stuffing against multiple services.
# The defender should detect cross-service credential reuse patterns.

experiment:
  id: "SCE-004"
  name: "Credential Compromise"
  target: "all"
  attacker: "stealthy"
  defender: "static"
  scenario: "known_attacks"
  duration: 100
  episodes: 50
  seed: 42
  expected_state: "service_available"
  tags: ["credential", "stealth", "cross_service", "phase0"]
  description: >
    Tests detection of stealthy credential compromise. The stealthy
    attacker uses slow, evasive tactics with credential stuffing across
    multiple services, attempting to stay below detection thresholds.

hypothesis:
  text: >
    Even against a stealthy credential attack, the defender should achieve
    a detection rate above 40% while keeping false positive rate below 30%.
  metric: "detection_rate"
  threshold: 0.4
  direction: "above"
