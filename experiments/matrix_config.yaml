# Experiment matrix configuration
# Defines the full attacker × defender × scenario grid for paper-quality results.

matrix:
  attackers:
    - scripted          # Baseline kill-chain (control group)
    - aggressive        # Fast-cycling deterministic
    - stealthy          # Slow, evasive deterministic
    - recon_heavy       # Reconnaissance-focused deterministic
    - rl                # Adaptive PPO attacker
    - llm               # LLM-assisted attacker

  defenders:
    - static            # Rule-based (control group)
    - ml                # Random Forest classifier
    - rl                # Adaptive PPO with Bayesian belief

  scenarios:
    - known_attacks
    - zero_day

  seeds: [42, 123]
  episodes_per_seed: 20
  duration: 100
  output_dir: "experiments/results/matrix"
