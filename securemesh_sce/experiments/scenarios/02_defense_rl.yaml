# experiments/scenarios/02_defense_rl.yaml
# Experiment 2: Autonomous Reinforcement Learning Defense
# Pits Level 0 Scripted Attacker against Level 3 RL Defender.

experiment:
  id: "SCE-002"
  name: "RL Defense vs Scripted Attacker"
  target: "all"
  attacker: "scripted"
  defender: "rl"
  duration: 60
  episodes: 25
  seed: 42
  expected_state: "service_available"
  tags: ["rl_defense", "autonomous", "level0_vs_level3"]
  description: >
    Evaluates whether an RL defender observing only physical system state
    can learn to suppress scripted attacks more effectively than static rules,
    while balancing intervention cost and service availability.

hypothesis:
  text: >
    The RL defender will achieve higher detection rate and lower cumulative impact
    than the static baseline against scripted attacks.
  metric: "detection_rate"
  threshold: 0.60
  direction: "above"
